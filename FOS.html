<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOS PROTOTYPE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--nav:#213f86;--nav2:#1b3476;--navtxt:#e8edf9;--navact:#5cc8ff;--ink:#1a1f2e;--mut:#6b7280;--line:#e6e9ef;--bg:#f5f6f9;--btn:#1e2f5a;--blue:#1d3a8a;--red:#d93a3a;--green:#2f9e44}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
/* prototype bar */
#ctl{background:#111827;color:#e5e7eb;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 14px;flex:0 0 auto}
#ctl .lbl{font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fbbf24;font-size:11px}
#ctl .seg{display:inline-flex;border:1px solid #4b5563;border-radius:6px;overflow:hidden}
#ctl .seg button{background:transparent;color:#d1d5db;border:0;padding:4px 9px;font-size:12px}
#ctl .seg button.on{background:#fbbf24;color:#111827;font-weight:600}
#ctl .seg button:disabled{opacity:.35;cursor:not-allowed}
#ctl .btn{background:#374151;border:0;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px}
#ctl .btn.pri{background:#2563eb}
#ctl label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
#note{background:#fef3c7;color:#78350f;font-size:12.5px;padding:7px 14px;display:flex;gap:10px;align-items:center;flex:0 0 auto;border-bottom:1px solid #fde68a}
#note b{margin-right:4px}#note button{margin-left:auto;background:none;border:0;font-size:16px;color:#78350f}
#shell{flex:1;display:flex;min-height:0}
/* sidebar */
#side{width:240px;background:var(--nav);color:var(--navtxt);display:flex;flex-direction:column;flex:0 0 240px;font-size:13px}
.brand{background:var(--nav2);height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:700;letter-spacing:.02em}
.brand .lg{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--nav);font-size:15px}
.brand .x{margin-left:auto;font-size:18px;opacity:.9}
.sjob{background:var(--nav2);padding:8px 8px 14px;display:flex}
.sjob .in{background:#fff;color:#999;flex:1;height:26px;border-radius:3px 0 0 3px;font-size:10.5px;padding:6px 6px}
.sjob .tg{background:#fff;color:var(--blue);font-size:9px;font-weight:700;padding:8px 4px;border-left:1px solid #ddd}
.sjob .go{background:#13224f;width:26px;height:26px;display:grid;place-items:center;border-radius:0 3px 3px 0}
.nv{display:flex;align-items:center;gap:12px;padding:0 14px;height:36px;cursor:default;opacity:.95}
.nv .ar{margin-left:auto;font-size:9px}
.sub{background:#1b3a7d;box-shadow:inset 0 0 0 1px #2c4d98}
.sub .nv{padding-left:26px;cursor:pointer}
.sub .nv.on{color:var(--navact);font-weight:600}
.sub .nv:hover{background:#264a95}
.sbot{margin-top:auto;border-top:2px solid #162b63;display:flex;justify-content:space-around;padding:10px 0;font-size:13px}
.ico{width:16px;height:16px;flex:0 0 16px;vertical-align:middle}
/* main */
#main{flex:1;overflow:auto;padding:14px 24px 20px;position:relative}
.ph{display:flex;align-items:center;justify-content:space-between;height:48px}
.ph h1{font-size:21px;margin:0;font-weight:700}
.cbtn{background:var(--btn);color:#fff;border:0;border-radius:6px;padding:0 16px;height:38px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.card{background:#fff;border-radius:6px;padding:12px 16px 16px;position:relative;margin-top:6px}
.frow{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.frow .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;height:46px;padding:0 12px;width:400px;flex:1 1 400px;max-width:400px;min-width:180px;box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:15px;color:var(--ink);min-width:0}
.fb{height:46px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 16px;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);color:#2b3245;position:relative}
.fb.on{background:#eef2ff;border-color:#a5b4fc}
.allmy{display:flex;border:1px solid var(--line);border-radius:8px;padding:4px;height:46px;gap:2px}
.allmy button{border:0;background:#fff;padding:0 18px;border-radius:5px;font-size:15px;font-weight:600;color:#222}
.allmy button.on{background:var(--btn);color:#fff}
.rng{color:#555;min-width:225px;justify-content:space-between}
/* branch field */
.bfw{position:relative;width:280px;flex:0 0 280px}
.bf{height:46px;border:1px solid var(--line);border-radius:6px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 8px;cursor:text;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:visible;position:relative}
.bf.open{border-color:#6b82d6;box-shadow:0 0 0 2px #dbe4ff}
.chip{display:inline-flex;align-items:center;gap:6px;background:#e9edf5;border-radius:14px;height:28px;padding:0 10px 0 6px;font-size:13.5px;max-width:170px;flex:0 1 auto;min-width:0}
.chip span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cx{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#4b5563;flex:0 0 16px;cursor:pointer}
.chip .cx:hover{background:#cfd6e4}
.badge{background:var(--blue);color:#fff;border-radius:12px;font-size:12px;font-weight:600;height:24px;padding:0 8px;display:inline-flex;align-items:center;position:relative;flex:0 0 auto;cursor:pointer}
.badge .tip{display:none;position:absolute;top:30px;left:0;background:#1f2937;color:#fff;border-radius:6px;padding:8px 12px;font-weight:400;font-size:12.5px;z-index:60;white-space:nowrap;max-height:220px;overflow:auto;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.badge:hover .tip{display:block}
.tip div{padding:2px 0}
.bf input{border:0;outline:0;flex:1;min-width:30px;font:inherit;font-size:14.5px;background:transparent}
.bf .ca{color:#6b7280;flex:0 0 auto;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;cursor:pointer;font-size:12px}
.bf .ca:hover{background:#eef0f4}
.dd{position:absolute;top:50px;left:0;width:100%;min-width:310px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(20,30,60,.16);z-index:50;padding:0 0 4px;max-height:300px;overflow:auto}
.opt{display:flex;gap:10px;align-items:center;padding:9px 14px;cursor:pointer}
.opt:hover{background:#f3f5fb}
.opt .s{color:var(--mut);font-size:12.5px}
.opt.all{border-bottom:1px solid var(--line);font-weight:600;position:sticky;top:0;background:#fff;z-index:2}
.cb{width:17px;height:17px;border:1.5px solid #9aa3b5;border-radius:3px;display:grid;place-items:center;flex:0 0 17px;background:#fff}
.cb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cb.on::after{content:"✓";font-size:12px;line-height:1}
/* tags */
.dp{display:inline-block;background:#e5e7eb;color:#6b7280;font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;text-transform:lowercase;font-style:normal;white-space:nowrap}
.dp.abs{position:absolute;top:-8px;left:6px;z-index:65;margin:0}
/* tabs */
.tabs{display:flex;gap:30px;padding:6px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:12px;position:relative}
.tabs button{background:none;border:0;font-size:15px;color:#555;display:flex;gap:7px;align-items:center;padding:4px 0}
.tabs button.on{color:var(--blue);font-weight:600}
/* table */
.tw{overflow-x:auto;position:relative}
table.t{border-collapse:collapse;width:100%;min-width:1000px}
table.t th{background:#f7f8fb;text-align:left;font-weight:600;font-size:14.5px;height:48px;padding:0 10px;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}
table.t td{padding:10px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle;height:62px;color:#2b3245}
table.t td b{font-weight:600;color:var(--ink);display:block}
table.t td small{display:block;color:var(--mut);font-size:13px}
table.t tr.cl:hover td{background:#fafbfd}
.th{display:inline-flex;align-items:center;gap:6px}
.th .s{cursor:pointer}
.th .fi{cursor:pointer;opacity:.75;display:inline-grid}
.th .fi.act{color:#2563eb;opacity:1}
.sa{font-size:10px;color:#2563eb}
.rb{width:32px;height:32px;border:1px solid var(--line);border-radius:5px;background:#fff;display:grid;place-items:center}
.st{cursor:pointer;color:#c4c9d6;display:grid;place-items:center;width:28px}
.st.on{color:#f59e0b}
.pill{display:inline-block;color:#fff;font-weight:600;font-size:13px;padding:3px 9px;border-radius:4px}
.empty{padding:60px 0;text-align:center;color:var(--mut);font-size:15px}
.foot{display:flex;align-items:center;justify-content:space-between;padding-top:14px;color:#444}
.foot select{height:42px;border:1px solid var(--line);border-radius:5px;padding:0 10px;font:inherit;margin-left:8px;background:#fff}
.pg{display:flex;gap:10px;align-items:center}
.pg button{width:36px;height:36px;border-radius:50%;border:0;background:#e5e8ee;color:#777}
.pg button:not(:disabled){background:#d4dbea;color:#1d3a8a}
.ov{position:absolute;inset:0;background:rgba(255,255,255,.72);display:grid;place-items:center;z-index:30;border-radius:4px}
.sp2{width:34px;height:34px;border:4px solid #cbd5f0;border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* pop & drawer & toast */
#pop{position:fixed;z-index:200}
.fb .rcar{color:#999;font-size:10px}
.rpmenu{background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(20,30,60,.18);width:250px;padding:6px}
.rpi{padding:10px 14px;color:#666;font-size:14.5px;cursor:pointer;border-radius:6px}
.rpi:hover{background:#f3f5fb}.rpi.on,.rpi.on:hover{background:#244380;color:#fff}
.rpw{display:flex;flex-wrap:wrap;width:min(820px,calc(100vw - 16px));background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(20,30,60,.18);font-size:14.5px}
.rpl{flex:1 1 520px;padding:12px 16px;min-width:0}.rpr{flex:0 0 250px;padding:6px 6px 0}
.rpn{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rpn button{background:none;border:0;color:#244380;font-size:24px;cursor:pointer;padding:0 10px;line-height:1}
.rps{display:flex}.rps select{height:40px;border:1px solid var(--line);background:#fff;padding:0 10px;font:inherit;font-size:16px;color:#333;width:110px;cursor:pointer}
.rps select:first-child{border-radius:6px 0 0 6px}.rps select:last-child{border-radius:0 6px 6px 0;border-left:0}
.rpms{display:flex;gap:24px;flex-wrap:wrap}.rpm{flex:1 1 210px}
.rpm h4{text-align:center;margin:8px 0 10px;font-size:16px}
.rpg{display:grid;grid-template-columns:repeat(7,1fr)}
.rpg b{text-align:center;font-weight:600;padding:6px 0}
.rpd{text-align:center;padding:10px 0;cursor:pointer;color:#333}
.rpd.out{color:#b4b4b4;cursor:default}.rpd.in{background:#ccc}.rpd.sel{background:#244380;color:#fff}.rpd:not(.out):not(.sel):hover{background:#e6e9f2}
.rpf{flex:1 1 100%;display:flex;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.rpf .sb.p{height:40px;padding:0 20px;font-weight:600;border-radius:6px}

.menu{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(20,30,60,.18);min-width:170px;padding:4px 0}
.menu div{padding:8px 14px;cursor:pointer;font-size:14px}
.menu div:hover{background:#f3f5fb}
.fpop{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(20,30,60,.18);padding:12px;width:230px}
.fpop input{width:100%;height:34px;border:1px solid #cfd5e2;border-radius:4px;padding:0 8px;font:inherit;margin-bottom:8px}
.fpop .r{display:flex;gap:8px;justify-content:flex-end}
.sb{border:1px solid #cfd5e2;background:#fff;border-radius:5px;padding:5px 12px;font-size:13px}
.sb.p{background:var(--btn);color:#fff;border-color:var(--btn)}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{color:#fff;padding:11px 20px;border-radius:6px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:560px;text-align:center}
.toast.r{background:var(--red)}.toast.g{background:var(--green)}
.dr{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;z-index:150;box-shadow:-8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
.drb{position:fixed;inset:0;background:rgba(15,23,42,.3);z-index:140}
.dr h2{margin:0;font-size:18px}
.dr .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr .bd{padding:16px 20px;overflow:auto;flex:1;position:relative}
.dr .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:relative}
.xb{background:none;border:0;font-size:20px;color:#555}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 12px;font-size:14px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.cfm .g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cfm .fl{min-width:0}
.atbs{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.atb{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:15px;color:#222;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,60,.08)}
.atb.on{border:2px solid #244380;color:#244380}
.cfm .dur{display:flex;align-items:center;gap:8px}.cfm .dur b{font-weight:600}.cfm .dur .inp{min-width:0}
.cfm .dtf{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;cursor:pointer;padding:0 12px;white-space:nowrap}
.cfm .dtf{overflow-x:auto;scrollbar-width:none}.cfm .dtf::-webkit-scrollbar{display:none}
.cfm .dtf span{flex:0 0 auto;white-space:nowrap}.cfm .dtf svg{flex:0 0 auto;position:sticky;right:0;margin-left:auto;background:inherit}
.cfm .dtf.ro{background:#ebedf1;cursor:default}
.cfm .dtf:focus{outline:none;border-color:var(--blue)}
.lblrow{display:flex;align-items:center;justify-content:space-between}.lblrow label{margin-bottom:6px}
.tzi{position:relative;display:inline-flex;margin-bottom:6px;outline:none}
.tzg{width:18px;height:18px;border-radius:50%;border:1.5px solid #6b7385;color:#6b7385;font:italic 700 12px/15px Georgia,serif;text-align:center;cursor:help}
.tzi:focus .tzg{border-color:#244380;color:#244380;box-shadow:0 0 0 2px #c9d6f2}
.tzt{display:none;position:absolute;right:0;top:26px;width:300px;max-width:80vw;background:#1f2937;color:#fff;border-radius:6px;padding:8px 12px;font-size:12.5px;line-height:1.4;font-weight:400;z-index:70;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.tzi:hover .tzt,.tzi:focus .tzt{display:block}
.cfm .tzin{white-space:nowrap;text-overflow:clip}
.tznote{margin-top:6px;font-size:12.5px;line-height:1.4;color:#7a5200;background:#fff6e0;border:1px solid #f1d9a0;border-radius:6px;padding:6px 10px}
.tzt div+div{margin-top:6px}
#vtip{position:fixed;z-index:300;max-width:380px;background:#1f2937;color:#fff;padding:6px 10px;border-radius:6px;font-size:12.5px;line-height:1.4;pointer-events:none;display:none;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.tzchip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;flex:0 0 auto}
.tzchip.tzlt{background:#e3edff;color:#244380}.tzchip.tzfo{background:#e2f4e6;color:#2d6a3a}
.pdd .pdr .tzx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;min-width:0;white-space:normal}
.pdd .pdr .tzcs{display:flex;gap:6px;flex:0 0 auto;margin-left:10px;align-items:flex-start}
.pdd .pdr.on .tzchip{background:rgba(255,255,255,.22);color:#fff}
.pdd .pdr.sep{border-top:1px solid var(--line)}
.pdd .pdr.mrow{display:flex;align-items:center;gap:12px}
.cbk{width:18px;height:18px;border:1.5px solid #9aa3b5;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex:0 0 auto;background:#fff}
.pdd .pdr.sel .cbk{background:#2f6df5;border-color:#2f6df5}
.pdd .pdr.sel{background:#244380;color:#fff}
.mfd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 36px 6px 10px;min-height:40px;cursor:text;height:auto}
.mfd span{display:contents}.mfd input{flex:1;min-width:80px;border:0;outline:none;font:inherit;font-size:14.5px;background:transparent;padding:4px 2px}
.mch{display:inline-flex;align-items:center;gap:6px;background:#e5e8ee;border-radius:14px;padding:4px 10px;font-size:13.5px}.mch i{font-style:normal;font-size:11px;cursor:pointer;font-weight:700}
.pkw{position:absolute;left:0;top:calc(100% + 4px);width:340px;max-width:calc(100vw - 40px);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(20,30,60,.18);z-index:80;padding:10px 12px}
.pkh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.pkh button{background:none;border:0;font-size:18px;cursor:pointer;color:#244380}
.pkg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.pkg i{font-style:normal;padding:6px 0;color:#555}
.pkd{padding:8px 0;border-radius:6px;background:#f7f8fb;cursor:pointer}.pkd.out{background:none;color:#c2c7d2;cursor:default}.pkd.sel{background:#244380;color:#fff}
.pkd:not(.out):not(.sel):hover{background:#e6e9f2}
.cfm .pcb .pkt .inp{padding:0 6px}
.pkt{display:flex;align-items:center;gap:8px;margin:10px 0}.pkt .inp{width:64px;text-align:center}.pkt select.inp{width:76px}
.pkf{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:10px}
#demoTz{position:fixed;left:252px;bottom:12px;z-index:120;font-size:13px}
#demoTz .dzb{background:#1f2937;color:#fff;border:0;border-radius:18px;padding:8px 14px;cursor:pointer;font-size:13px}
#demoTz .dzp{display:none;position:absolute;bottom:42px;left:0;width:320px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(20,30,60,.2);padding:12px;flex-direction:column;gap:10px}
#demoTz.open .dzp{display:flex}
#demoTz label{display:flex;flex-direction:column;gap:4px;font-weight:600;color:#333}
#demoTz select,#demoTz input{height:34px;border:1px solid #cfd5e2;border-radius:6px;font:inherit;font-size:13px;font-weight:400}
#demoTz small{color:#6b7385}
#demoTz label.dzc{flex-direction:row;align-items:center;gap:8px;font-weight:400}
#demoTz .dzn{font-size:12px;color:#7a5200;background:#fff6e0;border-radius:6px;padding:4px 8px}
#demoTz .dzn:empty{display:none}
.cs{width:440px}
.cs .hd{padding:18px 24px}.cs .hd h2{font-size:22px}
.csh{padding:18px 24px 12px;border-bottom:1px solid var(--line)}
.csa{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#244380;letter-spacing:.02em;font-size:15px}
.csn{margin-top:12px;color:#6b7385;font-size:14.5px}
.csb{padding:8px 24px}
.csr{display:flex;align-items:center;gap:14px;height:56px;cursor:grab;border-top:2px solid transparent}
.csr.dg{opacity:.4}.csr.ov{border-top-color:#244380}
.csr .dh2{color:#6b7385;font-size:18px;letter-spacing:-1px}

 }catch(x){}

function wallClockToInstant(local,tz){

 if(fmt=='short')return `${q.month} ${q.day}, ${q.year} ${q.hour}:${q.minute} ${q.dayPeriod}`;

function cbKey(e,id){

function settingsHTML(){
 const t=S.setTab,tabs=['Lead Stage','Opportunity Stage','Activity Status','Activity Reminder'];
 let body;
 const th=(h,f)=>`<th><span class="th">${h}${f?`<span class="fi">${I.filter}</span>`:''}</span></th>`;
 if(t=='Activity Reminder')body=`<div class="card"><div class="tw"><table class="t" style="min-width:900px"><thead><tr><th style="width:54px"></th>${th('Activity Type',1)}${th('Default Reminder',1)}${th('Modified By',1)}${th('Last Modified',1)}</tr></thead><tbody>${[['Call','5 Minutes','Rafia Khan','Friday, September 25, 2026 at 9:30:00 PM GMT+06:00'],['Email','No Reminder','--','--'],['Meeting','No Reminder','--','--'],['Task','No Reminder','--','--']].map(r=>`<tr><td><span class="rb">${I.dots}</span></td><td><b style="display:inline">${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div>`;
 else{const d=SET[t];body=`<div class="card"><div class="frow"><div class="search"><span>${I.search}</span><input placeholder="${d.ph}"></div><span class="sp"></span><button class="cbtn">${I.plus} ${d.cr}</button></div><div class="tw"><table class="t" style="min-width:1250px"><thead><tr><th style="width:40px"></th><th style="width:54px"><span>${I.cols}</span></th><th>Order</th>${th('Name',1)}${th('Colour',1)}${th('Status',1)}${th('Default',1)}${th('Created Date',1)}${th('Last Modified',1)}</tr></thead><tbody>${d.rows.map(r=>`<tr><td>${grip}</td><td><span class="rb">${I.dots}</span></td><td>${r[0]}</td><td><b>${r[1]}</b></td><td><span class="sw" style="background:${r[3]}"></span>${r[2]}</td><td><span class="pill" style="background:#4bb543">Active</span></td><td><span class="cb ${r[4]?'on':''}"></span></td><td>${r[5]}</td><td>${r[6]}</td></tr>`).join('')}</tbody></table></div></div>`}
 return `<div class="ph"><h1>Settings ${dp()}</h1></div><div class="stabs">${tabs.map(x=>`<button class="${t==x?'on':''}" onclick="S.setTab='${x}';render()">${x}</button>`).join('')}</div>${body}`}
/* ============ app / controls / guide ============ */
function appHTML(){
 if(S.screen=='cal')return calHTML();
 if(S.screen=='settings')return settingsHTML();
 if(S.screen=='leadD')return leadDHTML();
 if(S.screen=='oppD')return oppDHTML();
 return listHTML(S.screen)}
function ctlHTML(){
 return `<span class="lbl">Prototype controls</span>
 <span class="seg"><button class="${S.user==1?'on':''}" onclick="setUser(1)">User 1: Multi-branch manager</button><button class="${S.user==2?'on':''}" onclick="setUser(2)">User 2: Single-branch user</button></span>
 <span>Logged in to <select ${S.user==2?'disabled':''} onchange="setLB(this.value)" style="font-size:12px;padding:3px 6px;border-radius:5px;max-width:230px">${ORDER.map(b=>`<option value="${b}" ${S.lb==b?'selected':''}>${b} – ${brName(b)}</option>`).join('')}</select></span>
 <button class="btn pri" onclick="S.guide=true;renderGuide()">Scenario guide</button>
 <label><input type="checkbox" ${S.roleOff?'checked':''} onchange="S.roleOff=this.checked;render()"> Branch A Role: Update on Sales Tasks &amp; Activity unchecked</label>
 <label><input type="checkbox" ${S.calAB?'checked':''} onchange="S.calAB=this.checked;render()"> Calendar access: Branch A and B only</label>
 <button class="btn" onclick="init();render();renderGuide()">Reset prototype</button>`}
function setUser(u){S.user=u;S.lb='A';resetLists();S.screen=S.screen;render()}
function setLB(b){S.lb=b;resetLists();if(S.screen=='leadD'||S.screen=='oppD')S.screen='leads';S.det=null;render()}
function render(){
  $('ctl').innerHTML=ctlHTML();$('side').className=(S.screen=='leadD'||S.screen=='oppD'?'hide':'')+(S.sideOpen?' open':'');$('side').innerHTML=sideHTML();document.body.classList.toggle('det',S.screen=='leadD'||S.screen=='oppD');$('main').innerHTML='<button class="ham" onclick="S.sideOpen=!S.sideOpen;render()">≡</button>'+appHTML();$('drawer').innerHTML=drawerHTML();
 const n=$('note');if(S.note){n.style.display='flex';n.innerHTML=`<span><b>${S.note.id}</b>${S.note.text}</span><button onclick="S.note=null;render()">✕</button>`}else n.style.display='none';
 if(S.bf.open){const i=$('bfinput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}
const SC=[
 {id:'S1',t:'Placement on four listings',s:()=>{S.screen='leads'},i:'Open Leads, Contacts, Opportunities, Activities from the left menu. The Branch filter sits after Search; no label, no icon. Switch to User 2: the filter disappears.'},
 {id:'S2',t:'Dropdown, Select All, chips, "+N", tooltip, click targets',s:()=>{S.screen='leads';S.L.leads.sel=['A','B','C','D','E']},i:'Five branches are selected: "Royal Logistics +4". Open the dropdown (click chip, badge, empty area or arrow): 10 branches, the list scrolls and Select All stays on top. Try Select All (all 10 checked), untick one (Select All unchecked), type a name, city or country (no match shows "No options found"), hover "+4" for the tooltip, Esc / outside click closes. Note: "first chip" follows the A to J list order (assumption).'},
 {id:'S3',t:'Clearing: chip ×, dropdown, Clear All, placeholder, empty state',s:()=>{S.screen='leads';S.L.leads.sel=['A','B','C']},i:'Click the chip ×; untick in the dropdown; click Clear All ✕. With nothing selected see "Select Branch", "No Data Found", "0 of 0".'},
 {id:'S4',t:'Default, reset on leaving, single-branch user',s:()=>{S.screen='leads';S.L.leads.sel=['A','B']},i:'Open any Lead then press back, or click another menu: selection returns to the logged-in branch. Switch the logged-in branch (User 1) or switch to User 2.'},
 {id:'S5',t:'Filter interaction',s:()=>{S.screen='leads';const L=S.L.leads;L.sel=['A','B'];L.q='a';L.cf={stage:'New'};L.sort={k:'company',dir:'asc'};L.fav=true;L.rng=defRange()},i:'Search text, a column filter, sort and Show Favorite are preset. Change the branch: filters, search and Show Favorite clear; sort and date range stay; page goes to 1. Also try on Activities (tab returns to All Activities). Changing Date Range or All/My leaves the Branch filter alone.'},
 {id:'S6',t:'Records listed per branch (Company-level Party Visibility)',s:()=>{S.screen='leads';S.L.leads.sel=[...ORDER]},i:'All 10 branches are selected. Leads of every selected branch show regardless of Party Visibility. There is no Party Visibility control. Lead Details, Opportunity Details and Calendar have no Branch filter.'},
 {id:'S7',t:'Branch column',s:()=>{S.screen='leads';S.L.leads.sel=['A','B']},i:'Branch column shows with 2+ branches (before Lead ID). Open Column Settings (grid icon): hide it, drag it, filter it, sort it. Reduce to 1 branch and back to 2+: it reappears, position remembered. Note: hiding it also clears its sort (assumption).'},

 {id:'S10',t:'View-only: Activities, drawer, Lead and Opportunity mixes, permission message',s:()=>{S.screen='acts';S.L.acts.sel=['A','B']},i:'Activities: Edit/Delete/Duplicate on a Branch B activity are blocked; open its View drawer (Opportunity read-only). Open Lead "Alpha Freight" (A): the Opportunities tab shows an A and a B opportunity (B is view-only), the Activities feed shows A and B activities, and the Lead actions work. Open Opportunity "Q3 Freight Contract" (B): its Branch A activity "Meeting with McLaren" is also view-only there (activities on Opportunity Details follow the Opportunity branch, also in the View drawer). Open "SIN-NYC Air Freight" (A): its Branch B activity "Email to Meridian Freight" can be edited. Turn on the role toggle: Edit on a Branch B Activity shows the permission message, not the toast. Note: the toggle is applied to Activity Edit only.'},
  {id:'S11',t:'Calendar',s:()=>{S.screen='cal';S.calAB=true},i:'No Branch filter. The calendar shows your activities and your subordinates\' activities of the branches you have access to (the toggle sets A and B): Branch C and D events do not show. Click a Branch B event: the View Call Log drawer opens, View works, Edit and Delete show the toast; a Branch A event works. Turn the calendar toggle off to see every accessible branch, including Branch C and D events. Note: the screenshot default of the user filter is "My Activities" only; here it is preselected with Select All so AC-7.2 (subordinate activity shows) holds on load.'}];
function loadSc(i){const s=SC[i];S.user=1;S.lb='A';resetLists();S.det=null;S.drawer=null;s.s();S.note={id:s.id+' '+s.t+': ',text:s.i};S.guide=true;render();renderGuide()}
function renderGuide(){$('guide').innerHTML=S.guide?`<div class="gp"><div class="gh"><b>Scenario guide</b><button class="xb" style="color:#fff" onclick="S.guide=false;renderGuide()">✕</button></div><div class="gb">${SC.map((s,i)=>`<div class="sc"><h4>${s.id} ${s.t}</h4><p>${s.i}</p><button class="btn2 p" onclick="loadSc(${i})">Load scenario</button></div>`).join('')}</div></div>`:''}
/* ============ global events ============ */
document.addEventListener('click',e=>{
 let ch=false;
 if(S.bf.open&&!e.target.closest('#bfwrap')){S.bf.open=null;S.bf.q='';ch=true}
 if(S.pop&&!e.target.closest('#pop')){S.pop=null;renderPop()}
 if(S.calDD&&!e.target.closest('#caldd')){S.calDD=false;ch=true}
 if(ch)render()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){if(S.bf.open){S.bf.open=null;S.bf.q='';render()}S.pop=null;renderPop()}});
/* full-value tooltip for the horizontally scrollable form values: hover, keyboard focus, tap-and-hold */
(function(){
 const tip=document.createElement('div');tip.id='vtip';document.body.appendChild(tip);let tm;
 const tgt=e=>e.target.closest?e.target.closest('[data-vt]'):null;
 const show=el=>{const t=el.getAttribute('data-vt');if(!t)return;tip.textContent=t;tip.style.display='block';const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';tip.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+'px'};
 const hide=()=>{clearTimeout(tm);tip.style.display='none'};
 document.addEventListener('mouseover',e=>{const t=tgt(e);if(t)show(t)});
 document.addEventListener('mouseout',e=>{if(tgt(e))hide()});
 document.addEventListener('focusin',e=>{const t=tgt(e);if(t)show(t)});
 document.addEventListener('focusout',hide);
 document.addEventListener('touchstart',e=>{const t=tgt(e);if(t){clearTimeout(tm);tm=setTimeout(()=>show(t),500)}},{passive:true});
 document.addEventListener('touchmove',()=>clearTimeout(tm),{passive:true});
 document.addEventListener('touchend',()=>{clearTimeout(tm);setTimeout(hide,1500)});
 document.addEventListener('contextmenu',e=>{if(tgt(e)||(e.target.closest&&e.target.closest('.tzi')))e.preventDefault()});
 document.addEventListener('wheel',e=>{const t=tgt(e);if(!t||t.scrollWidth<=t.clientWidth)return;if(e.shiftKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)){t.scrollLeft+=e.deltaX||e.deltaY;e.preventDefault()}},{passive:false});
 document.addEventListener('keydown',e=>{const t=tgt(e);if(t&&t.tagName!='INPUT'&&(e.key=='ArrowRight'||e.key=='ArrowLeft')){t.scrollLeft+=e.key=='ArrowRight'?40:-40;e.preventDefault()}});
})();
init();render();demoPanel();
